services:
  - type: web
    name: delhi-grid-intelligence-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/render_build.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DELHI_GRID_CAPACITY_MW
        value: "8000"
      - key: RISK_LOW_THRESHOLD
        value: "0.60"
      - key: RISK_MEDIUM_THRESHOLD
        value: "0.75"
      - key: RISK_HIGH_THRESHOLD
        value: "0.90"
      - key: PYTHONIOENCODING
        value: "utf-8"
